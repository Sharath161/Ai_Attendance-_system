version: "3.9"

services:

  # ── FastAPI + HTML front-end ─────────────────────────────────────────────────
  api:
    build: .
    image: smart-attendance-api
    ports:
      - "8000:8000"
    volumes:
      - model_data:/app/work/models
      - spool_data:/app/work/spool
      - reg_data:/app/work/registrations
      - log_data:/app/work/logs
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://attendance:${DB_PASSWORD:-attendance}@db:5432/attendance"
      SPOOL_DIR: "work/spool"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Batch image-processing worker ────────────────────────────────────────────
  worker:
    build: .
    image: smart-attendance-api
    command: python -m worker.runner
    volumes:
      - model_data:/app/work/models
      - spool_data:/app/work/spool
      - reg_data:/app/work/registrations
      - log_data:/app/work/logs
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://attendance:${DB_PASSWORD:-attendance}@db:5432/attendance"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: "${DB_PASSWORD:-attendance}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  model_data:
  spool_data:
  reg_data:
  log_data:
